[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uninbench"
version = "0.1.0"
description = "Unified benchmarking framework for multi-robot coverage path planning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uninbench = "uninbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uninbench = ["simulator/*.html", "simulator/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
