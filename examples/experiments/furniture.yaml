# IF3 paired furniture variants: the same rooms with and without clutter.
#   uninbench import rooms datasets/test_maps --out data/IF3
name: furniture
output: results/furniture
instances:
  - {path: data/IF3, split: all}
team_sizes: [1, 2]
start_configs: [dispersed]
planners: [stc, mstc, mstc_star, mfc, ls_mcpp, darp_stc, gm_vpc, crc, scopp, mcfs, swath_bf, bcd, kmeans_tsp]
seeds: 5
repetitions: 3
workers: 4
task: {time_limit: 120}
