# Deconfliction profile: inter-robot conflicts are hard constraints (planners insert waits).
name: deconfliction
output: results/deconfliction
instances:
  - generate: {kind: synthetic, count: 3, sizes: [30], densities: [0.08], base_seed: 9}
    family: IF5
    split: all
team_sizes: [2, 4, 8]
start_configs: [clustered]
profiles: [deconfliction]
# none of these planners models inter-robot conflicts itself; they take part as compositions with the
# framework's prioritized-waiting stage (reported as <planner>+pw*)
deconfliction_stage: prioritized_waiting
planners: [mstc, mstc_star, darp_stc, gm_vpc, swath_bf, bcd, kmeans_tsp]
seeds: 5
repetitions: 3
workers: 4
task: {time_limit: 120}
