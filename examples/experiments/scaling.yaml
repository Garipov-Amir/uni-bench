# Scalability: environment size at constant obstacle density x team size.
name: scaling
output: results/scaling
instances:
  - generate: {kind: synthetic, count: 3, sizes: [20, 40, 80, 160], densities: [0.08], base_seed: 5}
    family: IF5
    split: all
team_sizes: [1, 2, 4, 8, 16, 32]
start_configs: [dispersed]
planners: [mstc, mstc_star, tmstc_star, mfc, ls_mcpp, darp_stc, gm_vpc, crc, scopp, swath_bf, bcd, kmeans_tsp]
seeds: 5
repetitions: 3
workers: 8
task: {time_limit: 300}
evaluation: {sensitivity: false}
