# IF4 connectivity sweep: SafeLog-like graphs from a spanning tree to the full grid.
name: connectivity
output: results/connectivity
instances:
  # the 21 published SafeLog maps (scripts/fetch_datasets.sh, then: uninbench import safelog datasets/safelog
  # --out data/IF4); grid planners receive the original graphs through the identity adapter (native_graph)
  - {path: data/IF4, split: all}
team_sizes: [1, 4]
start_configs: [dispersed, clustered]
planners: [stc, mstc, mstc_star, tmstc_star, mfc, mip, ls_mcpp, darp_stc, gm_vpc, darp_bf]
seeds: 5
repetitions: 3
workers: 4
task: {time_limit: 120}
